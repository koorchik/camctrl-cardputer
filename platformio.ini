; CamCtrl Cardputer: EthAir (USB-Ethernet <-> Wi-Fi bridge) plus a camera remote UI.
; ESP-IDF (not Arduino): Arduino 2.0.17 has no TinyUSB network class.

[env]
build_flags = -std=gnu++17

[device]
platform = espressif32@8.0.0
framework = espidf
board = m5stack-stamps3
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Cardputer ADV only: the remote needs its screen and keyboard.
[env:cardputer]
extends = device
build_flags = ${env.build_flags} -DBOARD_CARDPUTER=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = ${env.build_flags} -I src -I test/support/cjson -Wall -Wextra
build_src_filter = -<*> +<logic/*> +<../test/support/cjson/cJSON.c>
